<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b16" />
    <meta name="description" content="一个通过端侧姿态估计生成沉浸式声场反馈的实验性 WebApp。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Mikro Kosmos | Dance Field</title>
  </head>
  <body>
    <main class="immersive-app" aria-label="Mikro Kosmos 沉浸式舞蹈声场">
      <section class="immersive-stage" aria-label="摄像头输入、姿态解码和声场状态">
        <video id="camera" playsinline muted aria-label="实时摄像头预览"></video>
        <canvas id="poseCanvas" aria-hidden="true"></canvas>
        <canvas id="analysisCanvas" width="96" height="72" aria-hidden="true"></canvas>
        <div class="scan-grid" aria-hidden="true"></div>

        <aside class="telemetry telemetry-pose" aria-label="舞蹈姿态参数">
          <p class="telemetry-title">dance decode</p>
          <dl>
            <div>
              <dt>模型</dt>
              <dd id="modelValue">待机</dd>
            </div>
            <div>
              <dt>姿态</dt>
              <dd id="poseValue">0%</dd>
            </div>
            <div>
              <dt>能量</dt>
              <dd><span id="motionValue">0</span>%</dd>
            </div>
            <div>
              <dt>展开</dt>
              <dd><span id="spreadValue">0</span>%</dd>
            </div>
            <div>
              <dt>节奏</dt>
              <dd><span id="rhythmValue">0</span>%</dd>
            </div>
            <div>
              <dt>亮度</dt>
              <dd><span id="brightnessValue">0</span>%</dd>
            </div>
          </dl>
        </aside>

        <aside class="telemetry telemetry-audio" aria-label="音频生成参数">
          <p class="telemetry-title">audio synth</p>
          <dl>
            <div>
              <dt>声像</dt>
              <dd id="panValue">中间</dd>
            </div>
            <div>
              <dt>深度</dt>
              <dd id="depthValue">中景</dd>
            </div>
            <div>
              <dt>音高</dt>
              <dd><span id="frequencyValue">0</span>Hz</dd>
            </div>
            <div>
              <dt>脉冲</dt>
              <dd><span id="pulseValue">0</span>Hz</dd>
            </div>
            <div>
              <dt>增益</dt>
              <dd><span id="gainValue">0</span>%</dd>
            </div>
          </dl>
        </aside>

        <p id="cameraStatus" class="status-pill">等待授权摄像头、音频和端侧姿态模型</p>

        <section class="controls" aria-label="控制">
          <button id="startButton" type="button">进入声场</button>
          <button id="muteButton" class="secondary" type="button" disabled>静音</button>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@latest/dist/pose-detection.min.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
